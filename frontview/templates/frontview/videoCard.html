{% comment %} {/* Video Player Card */} {% endcomment %}
{% if featured_video.video_url %}
<section class="py-18 md:py-24">
  <div class="container max-w-4xl">
    {% include "frontview/sectionHeader.html" with title="Featured Video" %}
    <div class="bg-card border border-border rounded-lg overflow-hidden shadow-lg">
      <div class="relative pt-[56.25%] bg-black">
        <iframe
          class="absolute top-0 left-0 w-full h-full"
          src="{{featured_video.video_url}}"
          title="{{featured_video.title}}"
          frameborder="0"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
      <div class="p-6 md:p-8">
        <h3 class="font-heading font-semibold text-2xl text-foreground mb-3">
            {{ featured_video.title }}
        </h3>
        <p class="text-muted-foreground leading-relaxed">
            {{ featured_video.description }}
        </p>
      </div>
    </div>
  </div>
</section>
{% endif %}
