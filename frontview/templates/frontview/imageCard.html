{% comment %} {/* Image Card Component */} {% endcomment %}
<div class="bg-card border border-border rounded-lg overflow-hidden hover:shadow-lg transition-shadow group">
  <div class="relative overflow-hidden bg-muted h-64">
    <img
      src="{{ image.src }}"
      alt="{{ image.title }}"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
      loading="lazy"
    />
  </div>
  <div class="p-6">
    <h3 class="font-heading font-semibold text-lg text-foreground mb-2">
      {{ image.title }}
    </h3>
    <p class="text-muted-foreground text-sm leading-relaxed">
      {{ image.description }}
    </p>
  </div>
</div>
